<!DOCTYPE html>
<html>

<head>

    <title>Live Chat</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="sidebar">

            <h3>Online Users</h3>

            <ul id="users"></ul>

        </div>

        <div class="chat">

            <div id="messages"></div>

            <p id="typing"></p>

            <div class="input-box">

                <input
                    type="text"
                    id="message"
                    placeholder="Enter message"
                >

                <button id="send">
                    Send
                </button>

            </div>

        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>

</body>

</html>
